       y="68.658585"
       text-anchor="end"
       font-family="sans-serif"
       font-size="3.5px"
       font-weight="bold"
       fill="#ffffff">A</text>
    <text
       id="pin-3-label"
       x="109"
       y="56.658585"
       text-anchor="end"
       font-family="sans-serif"
       font-size="3.5px"
       font-weight="bold"
       fill="#ffffff">B</text>
    <text
       id="pin-4-label"
       x="109"
       y="44.658585"
       text-anchor="end"
       font-family="sans-serif"
       font-size="3.5px"
       font-weight="bold"
       fill="#ffffff">C</text>
    <text
       id="pin-5-label"
       x="109"
       y="32.658585"
       text-anchor="end"
       font-family="sans-serif"
       font-size="3.5px"
       font-weight="bold"
       fill="#ffffff">D</text>
    <text
       id="component-name"
       x="142"
       y="64.14"
       text-anchor="middle"
       font-family="sans-serif"
       font-size="0"
       fill="#000" />
  </g>
</svg>
